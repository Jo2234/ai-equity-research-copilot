services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AIERC_DATA_DIR: /app/data
      AIERC_SEED_DIR: /app/data/sample_documents
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:5173"
    depends_on:
      - api
